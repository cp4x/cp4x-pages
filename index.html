<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>cp4x — Currently Building</title>

    <meta
        name="description"
        content="See what cp4x is currently working on."
    >

    <style>
        :root {
            --bg: #020706;

            --panel: rgba(4, 13, 10, 0.94);
            --panel-soft: rgba(7, 22, 17, 0.75);

            --accent: #36ffa8;
            --accent-bright: #65ffc0;
            --accent-muted: #16895b;

            --status-color: #36ffa8;

            --cursor-color: #36ffa8;

            --text: #dce7e3;
            --text-muted: #849690;
            --text-dark: #52645e;

            --border: rgba(54, 255, 168, 0.24);
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 45px 30px;

            background:
                radial-gradient(
                    circle at 50% 25%,
                    rgba(20, 112, 75, 0.13),
                    transparent 38%
                ),
                linear-gradient(
                    rgba(54, 255, 168, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(54, 255, 168, 0.025) 1px,
                    transparent 1px
                ),
                var(--bg);

            background-size:
                auto,
                42px 42px,
                42px 42px,
                auto;

            color: var(--text);

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                Menlo,
                monospace;
        }


        /* ============================= */
        /* CUSTOM CURSOR                 */
        /* ============================= */

        body.custom-cursor-enabled,
        body.custom-cursor-enabled * {
            cursor: none !important;
        }


        .custom-cursor {
            position: fixed;

            top: 0;
            left: 0;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--cursor-color);

            box-shadow:
                0 0 5px var(--cursor-color),
                0 0 10px var(--cursor-color),
                0 0 18px var(--cursor-color);

            pointer-events: none;

            z-index: 999999;

            transform:
                translate(-50%, -50%);

            opacity: 0;

            transition:
                width 0.15s ease,
                height 0.15s ease,
                opacity 0.15s ease;
        }


        .custom-cursor-ring {
            position: fixed;

            top: 0;
            left: 0;

            width: 28px;
            height: 28px;

            border-radius: 50%;

            border: 1px solid var(--cursor-color);

            box-shadow:
                0 0 8px rgba(54, 255, 168, 0.25),
                inset 0 0 8px rgba(54, 255, 168, 0.08);

            pointer-events: none;

            z-index: 999998;

            transform:
                translate(-50%, -50%);

            opacity: 0;

            transition:
                width 0.18s ease,
                height 0.18s ease,
                opacity 0.15s ease,
                border-color 0.15s ease;
        }


        .custom-cursor.hovering {
            width: 10px;
            height: 10px;
        }


        .custom-cursor-ring.hovering {
            width: 42px;
            height: 42px;

            opacity: 0.75;
        }


        @media (pointer: coarse) {
            .custom-cursor,
            .custom-cursor-ring {
                display: none !important;
            }

            body.custom-cursor-enabled,
            body.custom-cursor-enabled * {
                cursor: auto !important;
            }
        }


        /* ============================= */
        /* PAGE                          */
        /* ============================= */

        .page {
            width: 100%;
            max-width: 820px;
        }


        .terminal {
            overflow: hidden;

            border:
                1px solid
                var(--border);

            border-radius: 16px;

            background:
                var(--panel);

            box-shadow:
                0 0 0 1px
                    rgba(54, 255, 168, 0.035),

                0 0 45px
                    rgba(0, 255, 153, 0.06);
        }


        .terminal-header {
            height: 58px;

            display: flex;
            align-items: center;

            padding:
                0 20px;

            border-bottom:
                1px solid
                rgba(54, 255, 168, 0.14);

            background:
                rgba(255, 255, 255, 0.015);
        }


        .window-buttons {
            display: flex;

            gap: 9px;
        }


        .window-button {
            width: 11px;
            height: 11px;

            border-radius: 50%;
        }


        .red {
            background: #ff5f57;
        }


        .yellow {
            background: #febc2e;
        }


        .green-window {
            background: #28c840;
        }


        .terminal-title {
            margin-left: 18px;

            color: #a8b8b2;

            font-size: 13px;
        }


        .version {
            margin-left: auto;

            color:
                var(--text-dark);

            font-size: 12px;
        }


        .terminal-body {
            padding: 38px;
        }


        .prompt {
            margin-bottom: 30px;

            color:
                var(--accent);

            font-size: 15px;

            text-shadow:
                0 0 10px
                rgba(54, 255, 168, 0.22);
        }


        .prompt-command {
            color: #d5dfdc;
        }


        .eyebrow {
            margin-bottom: 10px;

            color:
                var(--text-dark);

            font-size: 11px;

            letter-spacing: 2px;

            text-transform:
                uppercase;
        }


        .project {
            margin: 0;

            color: #f2f7f5;

            font-size:
                clamp(
                    30px,
                    6vw,
                    48px
                );

            letter-spacing:
                -1.5px;
        }


        /* ============================= */
        /* STATUS                        */
        /* ============================= */

        .status {
            display: inline-flex;
            align-items: center;

            gap: 9px;

            margin-top: 14px;

            color:
                var(--status-color);

            font-size: 14px;
        }


        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background:
                var(--status-color);

            box-shadow:
                0 0 8px
                    var(--status-color),

                0 0 18px
                    var(--status-color);

            animation:
                pulse 2.4s
                ease-in-out infinite;
        }


        .grid {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 14px;

            margin-top: 34px;
        }


        .card {
            padding: 19px;

            border:
                1px solid
                rgba(54, 255, 168, 0.12);

            border-radius: 10px;

            background:
                var(--panel-soft);
        }


        .card-title {
            margin-bottom: 8px;

            color:
                var(--text-dark);

            font-size: 11px;

            letter-spacing:
                1.5px;

            text-transform:
                uppercase;
        }


        .card-value {
            color: #cbd7d2;

            line-height: 1.6;
        }


        .description {
            margin-top: 14px;

            padding: 20px;

            border-left:
                2px solid
                var(--accent-muted);

            background:
                rgba(54, 255, 168, 0.025);

            color:
                var(--text-muted);

            line-height: 1.8;
        }


        .stack {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 26px;
        }


        .tag {
            padding:
                7px 11px;

            border:
                1px solid
                rgba(54, 255, 168, 0.17);

            border-radius: 7px;

            background:
                rgba(54, 255, 168, 0.04);

            color: #8cffc9;

            font-size: 12px;
        }


        /* ============================= */
        /* CURRENT ACTIVITY              */
        /* ============================= */

        .activity {
            margin-top: 30px;

            padding-top: 27px;

            border-top:
                1px solid
                rgba(54, 255, 168, 0.09);
        }


        .activity-line {
            display: flex;

            margin:
                9px 0;

            color:
                var(--text-muted);

            font-size: 13px;
        }


        .activity-prefix {
            width: 24px;

            color:
                var(--accent);
        }


        .activity-value {
            color: #bccac5;
        }


        .cursor {
            display: inline-block;

            width: 8px;
            height: 15px;

            margin-left: 5px;

            vertical-align:
                -2px;

            background:
                var(--accent);

            box-shadow:
                0 0 8px
                rgba(54, 255, 168, 0.45);

            animation:
                blink 1s
                steps(1)
                infinite;
        }


        /* ============================= */
        /* DEVELOPMENT LOG               */
        /* ============================= */

        .devlog {
            margin-top: 38px;

            padding-top: 30px;

            border-top:
                1px solid
                rgba(54, 255, 168, 0.10);
        }


        .devlog-header {
            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-end;

            gap: 20px;

            margin-bottom: 20px;
        }


        .devlog-heading {
            margin:
                5px 0 0;

            color: #e8efec;

            font-size: 20px;

            font-weight: 600;
        }


        .last-updated {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #6c837b;

            font-size: 11px;

            white-space: nowrap;
        }


        .last-updated-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                var(--accent);

            box-shadow:
                0 0 7px
                rgba(54, 255, 168, 0.7);
        }


        .log-list {
            display: flex;

            flex-direction:
                column;

            gap: 12px;
        }


        .log-entry {
            position: relative;

            padding: 20px;

            border:
                1px solid
                rgba(54, 255, 168, 0.10);

            border-radius: 10px;

            background:
                rgba(54, 255, 168, 0.022);

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }


        .log-entry:first-child {
            border-color:
                rgba(54, 255, 168, 0.25);

            background:
                rgba(54, 255, 168, 0.045);
        }


        .log-entry:first-child::before {
            content: "LATEST";

            position: absolute;

            top: 17px;
            right: 17px;

            padding:
                4px 7px;

            border:
                1px solid
                rgba(54, 255, 168, 0.18);

            border-radius: 5px;

            color: #6eeab1;

            background:
                rgba(54, 255, 168, 0.04);

            font-size: 9px;

            letter-spacing: 1px;
        }


        .log-entry:hover {
            border-color:
                rgba(54, 255, 168, 0.23);

            background:
                rgba(54, 255, 168, 0.04);

            transform:
                translateY(-1px);
        }


        .log-line {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 12px;

            color: #60776f;

            font-size: 11px;
        }


        .log-dot {
            width: 7px;
            height: 7px;

            flex:
                0 0 auto;

            border-radius: 50%;

            background:
                var(--accent);

            box-shadow:
                0 0 8px
                rgba(54, 255, 168, 0.55);
        }


        .log-entry h3 {
            margin:
                0 0 8px;

            padding-right: 55px;

            color: #d8e4df;

            font-size: 15px;
        }


        .log-entry p {
            margin: 0;

            color: #81948d;

            font-size: 13px;

            line-height: 1.7;
        }


        .log-tags {
            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 14px;
        }


        .log-tags span {
            padding:
                4px 8px;

            border:
                1px solid
                rgba(54, 255, 168, 0.13);

            border-radius: 5px;

            background:
                rgba(54, 255, 168, 0.025);

            color: #73cfa7;

            font-size: 10px;
        }


        /* ============================= */
        /* LINKS                         */
        /* ============================= */

        .links {
            display: flex;
            flex-wrap: wrap;

            gap: 10px;

            margin-top: 32px;
        }


        .link {
            display: inline-flex;

            align-items: center;

            padding:
                10px 15px;

            border:
                1px solid
                rgba(54, 255, 168, 0.18);

            border-radius: 8px;

            background:
                rgba(54, 255, 168, 0.035);

            color: #cddbd6;

            font-size: 13px;

            text-decoration: none;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .link:hover {
            border-color:
                rgba(54, 255, 168, 0.6);

            background:
                rgba(54, 255, 168, 0.07);

            color:
                var(--accent-bright);

            box-shadow:
                0 0 16px
                rgba(54, 255, 168, 0.08);
        }


        .footer {
            display: flex;

            justify-content:
                space-between;

            gap: 20px;

            margin-top: 22px;

            color: #42524d;

            font-size: 11px;
        }


        @keyframes blink {
            0%,
            48% {
                opacity: 1;
            }

            49%,
            100% {
                opacity: 0;
            }
        }


        @keyframes pulse {
            0%,
            100% {
                opacity: 0.7;

                transform:
                    scale(0.9);
            }

            50% {
                opacity: 1;

                transform:
                    scale(1.08);
            }
        }


        @media (max-width: 650px) {
            body {
                padding: 16px;
            }

            .terminal-body {
                padding:
                    25px 20px;
            }

            .grid {
                grid-template-columns:
                    1fr;
            }

            .devlog-header {
                align-items:
                    flex-start;

                flex-direction:
                    column;

                gap: 8px;
            }

            .footer {
                flex-direction:
                    column;

                gap: 6px;
            }
        }
    </style>
</head>

<!-- CUSTOM CURSOR -->

<div

<div

<div class="page">

            <div

            <div class="activity">

                    <span>

                    <span class="activity-prefix">
                        >

            <!-- DEVELOPMENT LOG -->

            <section class="devlog">

                <div class="devlog-header">

                    <div>

                        </div>

                    <div class="last-updated">

                        <span id="lastUpdatedText">

                <div

                ></div>

            </section>


            <!-- LINKS -->

            <div
                id="links"
                class="links"
            ></div>


            <div class="footer">

                <span id="footerLeft"></span>

                <span id="footerRight"></span>

            </div>

        </section>

    </main>

</div>


<script>

/*

=========================================================

You should almost never need to search through
the HTML above this point.

=========================================================
*/

        "UI Library + Live Services",

    /*
    =====================================================
    TECHNOLOGIES / TAGS
    =====================================================
    */

    stack: [
        "Lua",

        "UI",

    ],


    /*
    =====================================================
    CURRENT ACTIVITY
    =====================================================
    */

    activity: {

        status:
            "online",

        workingOn:
            "UI improvements",

        next:
            "module updates",

        build:
            "development"

    },


    /*

    CUSTOM MOUSE CURSOR
    =====================================================

    enabled:
        true  = custom glowing cursor
        false = normal browser cursor

    color:
        Any CSS color / HEX code.

    =====================================================
    */

    cursor: {

        enabled:
            true,

        color:
            "#36ffa8"

    },


    /*
    =====================================================
    LINKS
    =====================================================
    */

    links: [

        {
            text:
                "GitHub ↗",

            url:
                "https://github.com/cp4x"
        },

        {
            text:
                "YouTube ↗",

            url:
                "https://www.youtube.com/@cp4.x"
        },

        {
            text:
                "Development Discord ↗",

            url:
                "https://discord.gg/mes2W7prwf"
        }

    ],


    /*
    =====================================================
    FOOTER
    =====================================================
    */

    footer: {

        left:
            "small commits → big things",

        right:
            "cp4.x"

    },


    /*
    =====================================================
    DEVELOPMENT LOG
    =====================================================

    NEWEST UPDATE MUST GO FIRST.

    To add another update:

    Copy one {...} block,
    paste it ABOVE the others,
    then change the values.

    Time format:

    2026-09-18T11:30:00-04:00

    =====================================================
    */

    updates: [

        {
            time:
                "2026-09-18T11:00:00-04:00",

            displayDate:
                "September 18, 2026",

            title:
                "cp4x Dev Portal",

            description:
                "Created the cp4x development portal and started building a public page for showing current projects, development activity, and recent updates.",

            tags: [
                "Website",
                "GitHub Pages",
                "cp4x"
            ]
        },


        {
            time:
                "2026-09-18T10:15:00-04:00",

            displayDate:
                "September 18, 2026",

            title:
                "Discord Development Presence",

            description:
                "Finished setting up the cp4x Discord Rich Presence with project links, animated terminal artwork, and development information.",

            tags: [
                "Discord",
                "RPC",
                "Development"
            ]
        },


        {
            time:
                "2026-09-18T09:30:00-04:00",

            displayDate:
                "September 18, 2026",

            title:
                "Terminal Artwork",

            description:
                "Finished the animated development terminal artwork used by the cp4x Discord presence, including activity bars, cursor animation, and subtle neon effects.",

            tags: [
                "Design",
                "Animation",
                "UI"
            ]
        }

    ]

};


/*
=========================================================
         EVERYTHING BELOW RUNS AUTOMATICALLY
=========================================================

You normally do NOT need to edit below here.

=========================================================
*/


const root =
    document.documentElement;


/*
-------------------------
STATUS COLOR
-------------------------
*/

root.style.setProperty(
    "--status-color",
    CONFIG.status.color
);


/*
-------------------------
CURSOR COLOR
-------------------------
*/

root.style.setProperty(
    "--cursor-color",
    CONFIG.cursor.color
);


/*
-------------------------
BASIC PAGE CONTENT
-------------------------
*/

document.getElementById(
    "terminalTitle"
).textContent =
    CONFIG.terminalTitle;


document.getElementById(
    "version"
).textContent =
    CONFIG.version;


document.getElementById(
    "promptUser"
).textContent =
    CONFIG.prompt + " ";


document.getElementById(
    "projectName"
).textContent =
    CONFIG.projectName;


document.getElementById(
    "statusText"
).textContent =
    CONFIG.status.text;


document.getElementById(
    "currentFocus"
).textContent =
    CONFIG.currentFocus;


document.getElementById(
    "projectType"
).textContent =
    CONFIG.projectType;


document.getElementById(
    "description"
).textContent =
    CONFIG.description;


/*
-------------------------
STACK TAGS
-------------------------
*/

const stackContainer =
    document.getElementById(
        "stack"
    );


CONFIG.stack.forEach(
    item => {

        const tag =
            document.createElement(
                "span"
            );

        tag.className =
            "tag";

        tag.textContent =
            item;

        stackContainer.appendChild(
            tag
        );

    }
);


/*

CURRENT ACTIVITY

/*
-------------------------
DEVELOPMENT LOG
-------------------------
*/

const logList =
    document.getElementById(
        "logList"
    );


CONFIG.updates.forEach(
    update => {

        const article =
            document.createElement(
                "article"
            );

        article.className =

        const line =

            );

            document.createElement(

            );

        dot.className =

            document.createElement(
                "time"
            );

        time.dateTime =

        time.textContent =

        line.appendChild(
            dot
        );

        line.appendChild(
            time
        );


        const title =
            document.createElement(
                "h3"
            );

        title.textContent =
            update.title;


        const description =
            document.createElement(
                "p"
            );

        description.textContent =
            update.description;


        const tags =
            document.createElement(
                "div"
            );

        tags.className =
            "log-tags";


        update.tags.forEach(
            tagName => {

                const tag =
                    document.createElement(
                        "span"
                    );

                tag.textContent =
                    tagName;

                tags.appendChild(
                    tag
                );

            }
        );


        article.appendChild(
            line
        );

        article.appendChild(
            title
        );

        article.appendChild(
            description
        );

        article.appendChild(
            tags
        );


        logList.appendChild(
            article
        );

    }
);


/*
-------------------------
LAST UPDATED TIMER
-------------------------
*/

const lastUpdatedText =
    document.getElementById(
        "lastUpdatedText"
    );


if (
    CONFIG.updates.length > 0
) {

    const updatedAt =
        new Date(
            CONFIG.updates[0].time
        );


    function relativeTime(
        date
    ) {

        let seconds =
            Math.floor(
                (
                    Date.now() -
                    date.getTime()
                ) / 1000
            );


        if (seconds < 0) {
            seconds = 0;
        }


        if (seconds < 5) {
            return "just now";
        }


        if (seconds < 60) {

            return (
                seconds +
                " second" +
                (
                    seconds === 1
                        ? ""
                        : "s"
                ) +
                " ago"
            );

        }


        const minutes =
            Math.floor(
                seconds / 60
            );


        if (minutes < 60) {

            return (
                minutes +
                " minute" +
                (
                    minutes === 1
                        ? ""
                        : "s"
                ) +
                " ago"
            );

        }


        const hours =
            Math.floor(
                minutes / 60
            );


        if (hours < 24) {

            return (
                hours +
                " hour" +
                (
                    hours === 1
                        ? ""
                        : "s"
                ) +
                " ago"
            );

        }


        const days =
            Math.floor(
                hours / 24
            );


        if (days === 1) {
            return "yesterday";
        }


        if (days < 30) {

            return (
                days +
                " days ago"
            );

        }


        const months =
            Math.floor(
                days / 30
            );


        if (months < 12) {

            return (
                months +
                " month" +
                (
                    months === 1
                        ? ""
                        : "s"
                ) +
                " ago"
            );

        }


        const years =
            Math.floor(
                days / 365
            );


        return (
            years +
            " year" +
            (
                years === 1
                    ? ""
                    : "s"
            ) +
            " ago"
        );

    }


    function refreshLastUpdated() {

        lastUpdatedText.textContent =
            "Last updated " +
            relativeTime(
                updatedAt
            );

        lastUpdatedText.title =
            updatedAt.toLocaleString();

    }


    refreshLastUpdated();


    setInterval(
        refreshLastUpdated,
        1000
    );

}


/*
=========================================================
CUSTOM GLOWING MOUSE CURSOR
=========================================================
*/

const cursor =
    document.getElementById(
        "customCursor"
    );


const cursorRing =
    document.getElementById(
        "customCursorRing"
    );


if (
    CONFIG.cursor.enabled &&
    window.matchMedia(
        "(pointer: fine)"
    ).matches
) {

    document.body.classList.add(
        "custom-cursor-enabled"
    );


    let mouseX = 0;
    let mouseY = 0;

    let ringX = 0;
    let ringY = 0;


    document.addEventListener(
        "mousemove",
        event => {

            mouseX =
                event.clientX;

            mouseY =
                event.clientY;


            cursor.style.left =
                mouseX + "px";

            cursor.style.top =
                mouseY + "px";


            cursor.style.opacity =
                "1";

            cursorRing.style.opacity =
                "0.55";

        }
    );


    document.addEventListener(
        "mouseleave",
        () => {

            cursor.style.opacity =
                "0";

            cursorRing.style.opacity =
                "0";

        }
    );


    document.addEventListener(
        "mouseenter",
        () => {

            cursor.style.opacity =
                "1";

            cursorRing.style.opacity =
                "0.55";

        }
    );


    function animateRing() {

        ringX +=
            (
                mouseX -
                ringX
            ) * 0.16;


        ringY +=
            (
                mouseY -
                ringY
            ) * 0.16;


        cursorRing.style.left =
            ringX + "px";

        cursorRing.style.top =
            ringY + "px";


        requestAnimationFrame(
            animateRing
        );

    }


    animateRing();


    const interactiveElements =
        document.querySelectorAll(
            "a, button"
        );


    interactiveElements.forEach(
        element => {

            element.addEventListener(
                "mouseenter",
                () => {

                    cursor.classList.add(
                        "hovering"
                    );

                    cursorRing.classList.add(
                        "hovering"
                    );

                }
            );


            element.addEventListener(
                "mouseleave",
                () => {

                    cursor.classList.remove(
                        "hovering"
                    );

                    cursorRing.classList.remove(
                        "hovering"
                    );

                }
            );

        }
    );

}
else {

    cursor.style.display =
        "none";

    cursorRing.style.display =
        "none";

}

</script>
